name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Bump from the latest vX.Y.Z tag using conventional commits:
      #   "feat!:" / "BREAKING CHANGE" -> major, "feat:" -> minor, anything else -> patch.
      - name: Compute next version
        id: version
        run: |
          latest=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)
          if [ -z "$latest" ]; then
            base=0.0.0
            range=HEAD
          else
            base=${latest#v}
            range="$latest..HEAD"
          fi

          if [ -z "$(git rev-list "$range")" ]; then
            echo "No commits since $latest; nothing to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          log=$(git log --format='%s%n%b' "$range")
          IFS=. read -r major minor patch <<< "$base"
          if grep -qE '^[a-z]+(\([^)]*\))?!:|^BREAKING[ -]CHANGE' <<< "$log"; then
            major=$((major + 1)); minor=0; patch=0
          elif grep -qE '^feat(\([^)]*\))?:' <<< "$log"; then
            minor=$((minor + 1)); patch=0
          else
            patch=$((patch + 1))
          fi

          version="$major.$minor.$patch"
          echo "Releasing v$version (previous: ${latest:-none})"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
        if: steps.version.outputs.skip == 'false'
      - uses: docker/setup-buildx-action@v3
        if: steps.version.outputs.skip == 'false'

      - uses: docker/login-action@v3
        if: steps.version.outputs.skip == 'false'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        if: steps.version.outputs.skip == 'false'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=v${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ steps.version.outputs.version }}
            type=semver,pattern={{major}},value=v${{ steps.version.outputs.version }},enable=${{ !startsWith(steps.version.outputs.version, '0.') }}
            type=sha
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        if: steps.version.outputs.skip == 'false'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Tag + release only after the image is pushed, so a failed build doesn't burn a version.
      - name: Create GitHub release
        if: steps.version.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: v${{ steps.version.outputs.version }}
        run: |
          gh release create "$VERSION" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --generate-notes \
            --notes "Image: \`$IMAGE:${VERSION#v}\`"
